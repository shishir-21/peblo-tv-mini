services:
  db:
    image: postgres:16
    container_name: peblo-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peblo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peblo_password}
      POSTGRES_DB: ${POSTGRES_DB:-peblo_tv}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peblo-backend-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-peblo}:${POSTGRES_PASSWORD:-peblo_password}@db:5432/${POSTGRES_DB:-peblo_tv}
      - SECRET_KEY=${SECRET_KEY:-changeme}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    volumes:
      - storage_data_prod:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile.prod
    container_name: peblo-cms-prod
    restart: unless-stopped
    ports:
      - "5173:80"

  viewer:
    build:
      context: ./viewer
      dockerfile: Dockerfile.prod
    container_name: peblo-viewer-prod
    restart: unless-stopped
    ports:
      - "5174:80"

volumes:
  postgres_data_prod:
  storage_data_prod:
