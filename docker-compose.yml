services:
  db:
    image: postgres:16
    container_name: peblo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblo_password
      POSTGRES_DB: peblo_tv
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
